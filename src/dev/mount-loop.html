<!doctype html>
<html lang="en">
    <head>
        <title>SuperSplat Viewer — mount/unmount loop</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <link rel="stylesheet" href="./index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            /* one sized host per instance, side by side */
            #hosts {
                display: flex;
                height: 100%;
            }
            #hosts > div {
                flex: 1;
                min-width: 0;
                height: 100%;
                outline: 1px solid #444;
            }
            #harness {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 1000;
                max-height: calc(100vh - 16px);
                overflow: auto;
                padding: 8px 12px;
                background: rgba(0, 0, 0, 0.75);
                color: #e0dcdd;
                font: 12px/1.5 monospace;
                white-space: pre;
                pointer-events: none;
            }
            #harness .fail {
                color: #f66;
            }
            #playback {
                position: fixed;
                top: 8px;
                left: 8px;
                z-index: 1000;
                padding: 8px;
                background: #fff;
                color: #222;
                font: 13px sans-serif;
            }
            #annotation-controls {
                position: fixed;
                bottom: 56px;
                left: 8px;
                z-index: 1000;
                padding: 8px;
                background: #fff;
                color: #222;
                font: 13px sans-serif;
            }
        </style>
    </head>
    <body>
        <!--
            Development harness for Viewer.destroy(). Mounts the viewer into a host div through
            createViewer, waits for the first frame (or not, in immediate mode), destroys it,
            and repeats. Browsers cap live WebGL contexts at around 16, so twenty iterations
            that all reach a first frame is itself the leak test; each iteration also reports
            whether the previous context was released and whether the subtree was removed.

            TEMPORARY. This page is run by hand before any change to teardown-sensitive code
            merges (viewer-api-plan.md, phases D and E). It is rewritten as a browser test
            against createViewer at E4; delete it, and its emit in rollup.config.mjs, when that
            test lands.

            With ?instances=N it instead mounts N viewers at once into sibling hosts laid out
            side by side, checks they do not share dom, state or window globals, destroys the
            first while the second keeps rendering, then destroys the rest.

            Playback/camera mode keeps one viewer mounted with host controls alongside its own UI.
            Add &noui to check those controls without the overlay; &loop=none|repeat|pingpong
            supplies a short camera track for endpoint checks. Destroy also checks a pending
            legacy scrub settles and its frame listener is removed.

            Add &collision=<url> with a scene at least 5m across to exercise walk mode.
            Add &overlay in loaded mode with voxel collision to check lazy allocation and
            release of the overlay's compute resources on every teardown iteration.
            Annotation mode supplies two annotations and host selection controls. &annotations=N
            overrides the count in any mode, including teardown and two-instance checks.

            Browser mode supplies fullscreen/XR host controls and delayed-request teardown checks.
            XR callback simulations check cancellation without claiming to test a native session.

            Params: ?iterations=20  ?mode=loaded|immediate|playback|camera|annotations|browser|input  ?instances=2  ?webgl  ?content=  ?settings=
        -->
        <div id="hosts"></div>
        <pre id="harness"></pre>
        <div id="annotation-controls" hidden>
            <span id="annotation-buttons"></span>
            <button id="clear-annotation">Clear selection</button>
            <button id="hide-annotations">Toggle annotations</button>
            <button id="destroy-annotations">Destroy annotations</button>
            <div id="annotation-state"></div>
        </div>
        <div id="playback" hidden>
            <button id="host-play">Host play</button>
            <button id="host-pause">Host pause</button>
            <button id="host-seek">Host seek halfway</button>
            <button id="host-end">Host seek end</button>
            <button id="host-auto-pause">Pause on next seek</button>
            <button id="host-destroy">Destroy during scrub</button>
            <div>
                <button id="host-orbit">Host orbit</button>
                <button id="host-fly">Host fly</button>
                <button id="host-walk">Host toggle walk</button>
                <button id="host-frame">Host frame scene</button>
                <button id="host-reset">Host reset camera</button>
            </div>
            <div id="playback-state"></div>
        </div>

        <script type="module">
            import { createViewer } from './index.js';

            const url = new URL(location.href);
            const iterations = Number(url.searchParams.get('iterations') ?? 20);
            const instances = Number(url.searchParams.get('instances') ?? 1);
            const mode = url.searchParams.get('mode') ?? 'loaded';
            const renderer = url.searchParams.has('webgl') ? 'webgl' : 'webgpu';
            const contentUrl = url.searchParams.get('content') ?? './scene.compressed.ply';
            const settingsUrl = url.searchParams.get('settings') ?? './settings.json';

            const harness = document.getElementById('harness');
            const log = (line, fail = false) => {
                const span = document.createElement('span');
                span.textContent = `${line}\n`;
                if (fail) span.className = 'fail';
                harness.appendChild(span);
                console.log(`[mount-loop] ${line}`);
            };

            // A promise the viewer drops on teardown shows up here rather than in the console
            // only, so teardown paths that reject without a handler fail the run.
            const unhandled = [];
            window.addEventListener('unhandledrejection', (event) => {
                unhandled.push(event.reason?.message ?? String(event.reason));
            });
            window.addEventListener('error', (event) => {
                unhandled.push(event.message);
            });
            const reportUnhandled = () => {
                // a rejection is reported a task after it happens, so let the queue drain first
                return timeout(50).then(() => {
                    if (unhandled.length) {
                        log(`FAIL ${unhandled.length} unhandled error(s): ${unhandled.join(' | ')}`, true);
                    }
                    return unhandled.length;
                });
            };

            const settings = await (await fetch(settingsUrl)).json();
            if (mode === 'annotations' || url.searchParams.has('annotations')) {
                const count = Number(url.searchParams.get('annotations') ?? 2);
                settings.annotations = Array.from({ length: count }, (_, i) => ({
                    position: [i * 0.6 - 0.3, 0, 0],
                    title: `Annotation ${i + 1}`,
                    text: `Details for annotation ${i + 1}`,
                    camera: { initial: { position: [1.5 - i * 3, 1, 1.5], target: [0, 0, 0], fov: 85 } }
                }));
            }
            const loopMode = url.searchParams.get('loop');
            if (loopMode) {
                settings.startMode = 'animTrack';
                settings.animTracks = [
                    {
                        name: 'playback check',
                        duration: 4,
                        frameRate: 1,
                        loopMode,
                        interpolation: 'spline',
                        smoothness: 1,
                        keyframes: {
                            times: [0, 2, 4],
                            values: {
                                position: [1.5, 1, 1.5, -1.5, 1, 1.5, 1.5, 1, 1.5],
                                target: [0, 0, 0, 0, 0, 0, 0, 0, 0],
                                fov: [85, 85, 85]
                            }
                        }
                    }
                ];
            }

            // Every other option at its default; an embedded instance publishes no window.* hooks,
            // so two viewers cannot collide on them.
            const createOptions = () => ({
                contentUrl,
                renderer,
                exposeGlobals: false,
                collisionUrl: url.searchParams.get('collision') ?? undefined,
                ui: !url.searchParams.has('noui')
            });
            const cameraOf = (viewer) => viewer.app.root.findByName('camera');

            const hosts = document.getElementById('hosts');
            const addHost = () => {
                const h = document.createElement('div');
                hosts.appendChild(h);
                return h;
            };
            const timeout = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
            const until = async (test, ms) => {
                const deadline = performance.now() + ms;
                while (!test()) {
                    if (performance.now() > deadline) return false;
                    await timeout(100);
                }
                return true;
            };
            const handlesOf = (viewer) => {
                const device = viewer.app.graphicsDevice;
                return {
                    device,
                    gl: device.gl ?? null,
                    lost: device.wgpu ? device.wgpu.lost.then(() => true) : null
                };
            };
            const released = async ({ gl, lost }) =>
                gl ? gl.isContextLost() : await Promise.race([lost, timeout(1000, false)]);

            const enableVoxelOverlay = async (viewer) => {
                const device = viewer.app.graphicsDevice;
                if (device.deviceType !== 'webgpu' || !(await until(() => viewer.state.hasCollisionOverlay, 10000))) {
                    throw new Error('overlay check requires WebGPU and voxel collision');
                }
                if (Array.from(device.textures).some((texture) => texture.name === 'VoxelOverlay-Storage')) {
                    throw new Error('voxel overlay allocated a texture before being enabled');
                }

                let overlayCompute;
                const dispatch = device.computeDispatch;
                device.computeDispatch = function (computes, ...args) {
                    overlayCompute ??= computes.find((compute) => compute.name === 'VoxelDebugOverlay');
                    return dispatch.call(this, computes, ...args);
                };
                try {
                    viewer.state.collisionOverlayEnabled = true;
                    if (!(await until(() => !!overlayCompute, 10000))) {
                        throw new Error('voxel overlay did not dispatch');
                    }
                } finally {
                    device.computeDispatch = dispatch;
                }

                let shaderDestroyed = false;
                const shader = overlayCompute.shader;
                const destroy = shader.destroy;
                shader.destroy = function () {
                    shaderDestroyed = true;
                    return destroy.call(this);
                };
                return () =>
                    !overlayCompute.impl && shaderDestroyed && !overlayCompute.getParameter('outputTexture').device;
            };

            // Teardown during a metadata load. `meta.json` content is read with an await before
            // the asset is registered, so a destroy can land inside it and the continuation must
            // not touch the app it just lost. Driven with a `contents` promise this page
            // controls, so the timing is exact rather than a race with the network; the url is
            // never fetched, since supplying `contents` is what the document does too.
            const metaTeardown = async () => {
                const host = addHost();
                const before = unhandled.length;
                let deliver;
                const contents = new Promise((resolve) => {
                    deliver = () => resolve(new Response('{}'));
                });
                const viewer = await createViewer({
                    container: host,
                    settings,
                    ...createOptions(),
                    contentUrl: './meta.json',
                    contents
                });
                viewer.destroy();
                deliver();
                await timeout(100);
                host.remove();
                return unhandled.length === before;
            };

            if (mode === 'input') {
                const check = (name, ok) => log(`${ok ? 'ok  ' : 'FAIL'} ${name}`, !ok);
                const rejects = (action) => {
                    try {
                        action();
                        return false;
                    } catch {
                        return true;
                    }
                };
                const keys = ['performanceMode', 'gamingControls', 'showAnnotations', 'retinaDisplay'];
                const saved = keys.map((key) => localStorage.getItem(key));
                const viewers = [];
                try {
                    keys.forEach((key) => localStorage.removeItem(key));
                    localStorage.setItem('retinaDisplay', 'false');
                    const host = addHost();
                    const viewer = await createViewer({ container: host, settings, ...createOptions() });
                    viewers.push(viewer);
                    check(
                        'movement rejects before readiness',
                        rejects(() => viewer.setMoveInput(0, 1))
                    );
                    check(
                        'legacy performance preference migrated',
                        viewer.state.performanceMode &&
                            localStorage.getItem('performanceMode') === 'true' &&
                            localStorage.getItem('retinaDisplay') === null
                    );
                    check(
                        'creation does not persist defaults',
                        localStorage.getItem('gamingControls') === null &&
                            localStorage.getItem('showAnnotations') === null
                    );
                    viewer.state.performanceMode = false;
                    viewer.state.gamingControls = true;
                    viewer.state.showAnnotations = false;
                    check(
                        'all preference writes persist',
                        keys.slice(0, 3).every((key) => localStorage.getItem(key) === String(viewer.state[key]))
                    );
                    const otherHost = addHost();
                    const other = await createViewer({ container: otherHost, settings, ...createOptions(), ui: false });
                    viewers.push(other);
                    check(
                        'headless instance restores all preferences',
                        !other.state.performanceMode && other.state.gamingControls && !other.state.showAnnotations
                    );
                    // Avoid desktop pointer lock while the first-person camera initializes.
                    viewer.state.gamingControls = other.state.gamingControls = false;
                    other.state.showAnnotations = true;
                    check(
                        'headless writes persist without changing a live sibling',
                        localStorage.getItem('showAnnotations') === 'true' && !viewer.state.showAnnotations
                    );
                    check('both loaded', await until(() => viewer.state.loaded && other.state.loaded, 30000));
                    check(
                        'invalid movement axes reject',
                        rejects(() => viewer.setMoveInput(NaN, 0)) && rejects(() => viewer.setMoveInput(0, Infinity))
                    );
                    viewer.state.cameraMode = other.state.cameraMode = 'fly';
                    viewer.state.inputEnabled = false;
                    await timeout(1000);
                    const position = (v) => cameraOf(v).getPosition().clone();
                    const stationary = async (v) => {
                        const before = position(v);
                        await timeout(150);
                        return position(v).distance(before) < 0.001;
                    };
                    const before = position(viewer);
                    const otherBefore = position(other);
                    viewer.setMoveInput(0, 100);
                    await timeout(200);
                    viewer.setMoveInput(0, 0);
                    const travel = position(viewer).distance(before);
                    check(
                        'movement works without gaming controls or keyboard ownership and clamps axes',
                        travel > 0.1 && travel < 1.5
                    );
                    check('movement stays in its instance', position(other).distance(otherBefore) < 0.001);
                    check('zero input stops movement', await stationary(viewer));
                    viewer.setMoveInput(1, 0);
                    window.dispatchEvent(new Event('blur'));
                    check('blur clears held movement', await stationary(viewer));
                    viewer.setMoveInput(1, 0);
                    document.dispatchEvent(new Event('visibilitychange'));
                    check('visibility change clears held movement', await stationary(viewer));
                    viewer.setMoveInput(0, 1);
                    viewer.state.cameraMode = 'orbit';
                    viewer.setMoveInput(0, 1); // ignored, rather than queued for the next fly session
                    viewer.state.cameraMode = 'fly';
                    await timeout(1000);
                    check('mode changes clear movement and orbit input is not queued', await stationary(viewer));

                    const root = host.firstElementChild;
                    const joystick = root.querySelector('.sse-joystickBase');
                    if (joystick) {
                        // Simulate touch UI input; native pointer capture still needs a touch-device check.
                        root.dispatchEvent(new PointerEvent('pointerdown', { pointerType: 'touch', bubbles: true }));
                        viewer.state.gamingControls = true;
                        check('joystick visible in touch gaming mode', !joystick.classList.contains('sse-hidden'));
                        const rect = joystick.getBoundingClientRect();
                        const pointer = (name) =>
                            joystick.dispatchEvent(
                                new PointerEvent(name, {
                                    pointerId: 99,
                                    pointerType: 'touch',
                                    clientX: rect.left + rect.width / 2,
                                    clientY: rect.top + 5,
                                    bubbles: true
                                })
                            );
                        joystick.setPointerCapture = () => {};
                        const beforeStick = position(viewer);
                        pointer('pointerdown');
                        await timeout(150);
                        pointer('pointercancel');
                        check(
                            'built-in joystick drives the shared movement command',
                            position(viewer).distance(beforeStick) > 0.05
                        );
                        check('pointer cancel stops the joystick', await stationary(viewer));
                        pointer('pointerdown');
                        pointer('lostpointercapture');
                        check('lost capture stops the joystick', await stationary(viewer));
                        pointer('pointerdown');
                        viewer.state.gamingControls = false;
                        check(
                            'hiding joystick stops movement',
                            joystick.classList.contains('sse-hidden') && (await stationary(viewer))
                        );
                        delete joystick.setPointerCapture;
                    }
                    const originalSet = Storage.prototype.setItem;
                    try {
                        Storage.prototype.setItem = () => {
                            throw new Error('simulated blocked storage');
                        };
                        viewer.state.performanceMode = !viewer.state.performanceMode;
                        check('blocked storage does not prevent state changes', viewer.state.performanceMode);
                    } finally {
                        Storage.prototype.setItem = originalSet;
                    }

                    viewer.setMoveInput(0, 1);
                    const gpu = handlesOf(viewer);
                    viewer.destroy();
                    const stored = localStorage.getItem('performanceMode');
                    viewer.state.performanceMode = !viewer.state.performanceMode;
                    check(
                        'destroy removes preference subscriptions',
                        localStorage.getItem('performanceMode') === stored
                    );
                    check(
                        'movement rejects after destruction',
                        rejects(() => viewer.setMoveInput(0, 0))
                    );
                    window.dispatchEvent(new Event('blur'));
                    document.dispatchEvent(new Event('visibilitychange'));
                    joystick?.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 99 }));
                    check('movement teardown releases context and subtree', (await released(gpu)) && !root.isConnected);
                    other.destroy();

                    // Reads can remain available when migration writes fail. Preserve every
                    // saved preference, including the in-memory legacy performance value.
                    for (const legacyRetina of ['true', 'false']) {
                        for (const operation of ['setItem', 'removeItem']) {
                            localStorage.removeItem('performanceMode');
                            localStorage.setItem('retinaDisplay', legacyRetina);
                            localStorage.setItem('gamingControls', 'true');
                            localStorage.setItem('showAnnotations', 'false');
                            const original = Storage.prototype[operation];
                            try {
                                Storage.prototype[operation] = () => {
                                    throw new Error(`simulated migration ${operation} failure`);
                                };
                                const migrated = await createViewer({
                                    container: addHost(),
                                    settings,
                                    ...createOptions(),
                                    ui: false
                                });
                                viewers.push(migrated);
                                check(
                                    `failed ${operation} preserves preferences (retinaDisplay=${legacyRetina})`,
                                    migrated.state.performanceMode === (legacyRetina === 'false') &&
                                        migrated.state.gamingControls &&
                                        !migrated.state.showAnnotations
                                );
                                check(
                                    `failed ${operation} retains the legacy storage key`,
                                    localStorage.getItem('retinaDisplay') === legacyRetina
                                );
                                migrated.destroy();
                            } finally {
                                Storage.prototype[operation] = original;
                            }
                        }
                    }

                    const originalGet = Storage.prototype.getItem;
                    try {
                        Storage.prototype.getItem = () => {
                            throw new Error('simulated blocked storage');
                        };
                        const noStorage = await createViewer({
                            container: addHost(),
                            settings,
                            ...createOptions(),
                            ui: false
                        });
                        viewers.push(noStorage);
                        check(
                            'blocked storage still permits creation',
                            !noStorage.state.gamingControls && noStorage.state.showAnnotations
                        );
                        noStorage.destroy();
                    } finally {
                        Storage.prototype.getItem = originalGet;
                    }
                    if (!(await reportUnhandled())) log('done, movement and preferences verified');
                } finally {
                    viewers.forEach((viewer) => viewer.destroy());
                    keys.forEach((key, index) =>
                        saved[index] === null ? localStorage.removeItem(key) : localStorage.setItem(key, saved[index])
                    );
                }
            } else if (mode === 'browser') {
                const check = (name, ok) => log(`${ok ? 'ok  ' : 'FAIL'} ${name}`, !ok);
                const rejects = async (work) => {
                    try {
                        await work;
                        return false;
                    } catch {
                        return true;
                    }
                };
                const viewers = [];
                for (let i = 0; i < 2; i++) {
                    const host = addHost();
                    const viewer = await createViewer({ container: host, settings, ...createOptions() });
                    viewers.push(viewer);
                    check(`viewer ${i + 1}: XR rejects before readiness`, await rejects(viewer.startXR('vr')));
                    await viewer.endXR();
                    check(`viewer ${i + 1}: loaded`, await until(() => viewer.state.loaded, 30000));
                }
                const [viewer, other] = viewers;
                const root = viewer.app.graphicsDevice.canvas.parentElement;
                const panel = document.createElement('div');
                panel.style.cssText =
                    'position:absolute;top:8px;left:8px;z-index:1000;background:white;color:black;padding:8px';
                root.appendChild(panel);
                const status = document.createElement('div');
                const update = () => {
                    status.textContent = `Fullscreen ${viewer.state.isFullscreen}; XR ${viewer.state.xrMode}; AR ${viewer.state.canStartAR}/${viewer.state.hasAR}; VR ${viewer.state.canStartVR}/${viewer.state.hasVR}`;
                };
                const subscriptions = ['isFullscreen', 'xrMode', 'canStartAR', 'canStartVR', 'hasAR', 'hasVR'].map(
                    (key) => viewer.events.on(`${key}:changed`, update)
                );
                const button = (title, run) => {
                    const button = document.createElement('button');
                    button.textContent = title;
                    button.onclick = () => {
                        Promise.resolve(run()).catch((error) => log(`FAIL ${title}: ${error.message}`, true));
                    };
                    panel.appendChild(button);
                };
                button('Host fullscreen', async () => {
                    await viewer.requestFullscreen();
                    check(
                        'native fullscreen owns this root',
                        document.fullscreenElement === root && viewer.state.isFullscreen
                    );
                    check('other viewer stays out of fullscreen', !other.state.isFullscreen);
                    await other.exitFullscreen();
                    check('other viewer cannot exit this fullscreen', document.fullscreenElement === root);
                    if (!url.searchParams.has('noui')) {
                        check(
                            'built-in buttons follow host fullscreen',
                            root.querySelector('.sse-enterFullscreen').classList.contains('sse-hidden') &&
                                !root.querySelector('.sse-exitFullscreen').classList.contains('sse-hidden')
                        );
                    }
                });
                button('Host exit fullscreen', async () => {
                    await viewer.exitFullscreen();
                    check('host exits fullscreen', !viewer.state.isFullscreen && document.fullscreenElement !== root);
                });
                for (const mode of ['ar', 'vr']) {
                    button(`Host ${mode.toUpperCase()}`, async () => {
                        try {
                            await viewer.startXR(mode);
                            log(`XR ${mode} started`);
                        } catch (error) {
                            log(`XR ${mode} refused: ${error.message}`);
                        }
                    });
                    if (!(mode === 'ar' ? viewer.state.canStartAR : viewer.state.canStartVR)) {
                        check(`unavailable ${mode} rejects`, await rejects(viewer.startXR(mode)));
                    }
                }
                button('Host end XR', async () => {
                    await viewer.endXR();
                    check('XR ended or idle', viewer.state.xrMode === null);
                });
                check('invalid XR mode rejects', await rejects(viewer.startXR('invalid')));

                // Simulate a refusal and a delayed engine callback, without asking for hardware.
                const xr = other.app.xr;
                const originalStart = xr.start;
                const originalAvailable = xr.isAvailable;
                const camera = cameraOf(other).camera;
                const { nearClip, farClip } = camera;
                xr.isAvailable = () => true;
                xr.start = (camera, type, space, options) => options.callback(new Error('simulated refusal'));
                check('XR refusal rejects', await rejects(other.startXR('vr')));
                check('XR refusal restores clipping', camera.nearClip === nearClip && camera.farClip === farClip);
                xr.start = originalStart;
                xr.isAvailable = originalAvailable;

                button('Destroy pending XR', async () => {
                    let callback;
                    xr.isAvailable = () => true;
                    xr.start = (camera, type, space, options) => {
                        callback = options.callback;
                    };
                    const pending = rejects(other.startXR('vr'));
                    check('duplicate XR start rejects', await rejects(other.startXR('vr')));
                    check('XR end during startup rejects', await rejects(other.endXR()));
                    xr.start = originalStart;
                    xr.isAvailable = originalAvailable;
                    const gpu = handlesOf(other);
                    other.destroy();
                    check('pending XR rejects on destruction', await Promise.race([pending, timeout(1000, false)]));
                    callback(null);
                    check('XR callback after destruction leaves state idle', other.state.xrMode === null);
                    check('XR destruction releases context', await released(gpu));
                    check(
                        'XR commands reject after destruction',
                        (await rejects(other.startXR('vr'))) && (await rejects(other.endXR()))
                    );
                    await reportUnhandled();
                });
                button('Destroy pending fullscreen', async () => {
                    const pending = rejects(viewer.requestFullscreen());
                    const gpu = handlesOf(viewer);
                    subscriptions.forEach((subscription) => subscription.off());
                    viewer.destroy();
                    check(
                        'pending fullscreen rejects on destruction',
                        await Promise.race([pending, timeout(1000, false)])
                    );
                    await timeout(200);
                    check(
                        'destroy removes fullscreen and subtree',
                        !viewer.state.isFullscreen && document.fullscreenElement !== root && !root.isConnected
                    );
                    check('fullscreen destruction releases context', await released(gpu));
                    check(
                        'fullscreen commands reject after destruction',
                        (await rejects(viewer.requestFullscreen())) && (await rejects(viewer.exitFullscreen()))
                    );
                    // Retained controls and browser events must not re-enter the dead viewer.
                    root.querySelector('.sse-enterFullscreen')?.click();
                    screen.orientation?.dispatchEvent(new Event('change'));
                    document.dispatchEvent(new Event('fullscreenchange'));
                    await reportUnhandled();
                });
                panel.appendChild(status);
                update();
                await reportUnhandled();
                log('Browser controls ready; use real clicks for fullscreen and XR permission checks.');
            } else if (mode === 'annotations') {
                const host = addHost();
                const viewer = await createViewer({ container: host, settings, ...createOptions() });
                const { state, events, annotations } = viewer;
                const check = (name, ok) => log(`${ok ? 'ok  ' : 'FAIL'} ${name}`, !ok);
                const rejectsSelection = (index) => {
                    try {
                        viewer.selectAnnotation(index);
                        return false;
                    } catch {
                        return true;
                    }
                };
                check('annotation data is available before load', annotations.length === settings.annotations.length);
                check('initial selection is null', state.selectedAnnotation === null);
                check('selection before load throws', !state.loaded && rejectsSelection(null));
                check('loaded', await until(() => state.loaded, 120000));
                state.gamingControls = false;
                state.showAnnotations = true;
                const changes = [];
                events.on('selectedAnnotation:changed', (value, previous) => changes.push([value, previous]));
                check(
                    'invalid indices throw without selecting',
                    [-1, 0.5, NaN, Infinity, annotations.length].every(rejectsSelection) &&
                        state.selectedAnnotation === null &&
                        changes.length === 0
                );
                if (annotations.length) {
                    const paused = state.animationPaused;
                    const atAnnotation = () => {
                        const p = cameraOf(viewer).getPosition();
                        const target = annotations[0].camera.initial.position;
                        return Math.hypot(p.x - target[0], p.y - target[1], p.z - target[2]) < 0.01;
                    };
                    viewer.selectAnnotation(0);
                    check(
                        'selection uses orbit and preserves pause',
                        state.cameraMode === 'orbit' && state.animationPaused === paused
                    );
                    check('camera reaches annotation pose', await until(atAnnotation, 5000));
                    viewer.frameScene();
                    viewer.selectAnnotation(0);
                    check('reselecting navigates again', await until(atAnnotation, 5000));
                    const position = cameraOf(viewer).getPosition().clone();
                    viewer.selectAnnotation(null);
                    check(
                        'clear preserves camera',
                        state.selectedAnnotation === null && cameraOf(viewer).getPosition().equals(position)
                    );
                    check(
                        'selection events report index and previous',
                        JSON.stringify(changes) === '[[0,null],[null,0]]'
                    );
                    state.showAnnotations = false;
                    viewer.selectAnnotation(0);
                    check(
                        'hidden annotations can still be selected',
                        state.selectedAnnotation === 0 && !state.showAnnotations
                    );
                    state.showAnnotations = true;
                } else {
                    viewer.selectAnnotation(null);
                    check('clearing an empty list is safe', state.selectedAnnotation === null);
                }
                const ui = !url.searchParams.has('noui');
                check(
                    'hotspots follow the UI option',
                    host.querySelectorAll('.sse-annotation-hotspot').length === (ui ? annotations.length : 0)
                );
                const status = document.getElementById('annotation-state');
                const update = () => {
                    status.textContent = `selected=${state.selectedAnnotation} mode=${state.cameraMode} visible=${state.showAnnotations}`;
                };
                ['selectedAnnotation', 'cameraMode', 'showAnnotations'].forEach((key) =>
                    events.on(`${key}:changed`, update)
                );
                update();
                document.getElementById('annotation-controls').hidden = false;
                annotations.forEach((annotation, index) => {
                    const button = document.createElement('button');
                    button.textContent = `Select ${annotation.title}`;
                    button.onclick = () => viewer.selectAnnotation(index);
                    document.getElementById('annotation-buttons').appendChild(button);
                });
                document.getElementById('clear-annotation').onclick = () => viewer.selectAnnotation(null);
                document.getElementById('hide-annotations').onclick = () => {
                    state.showAnnotations = !state.showAnnotations;
                };
                document.getElementById('destroy-annotations').onclick = async () => {
                    const handles = handlesOf(viewer);
                    const root = host.querySelector('.sse-viewer');
                    const hotspot = host.querySelector('.sse-annotation-hotspot');
                    if (annotations.length) viewer.selectAnnotation(0);
                    state.controlsHidden = true; // leave a tooltip fade pending during destruction
                    const selected = state.selectedAnnotation;
                    viewer.destroy();
                    check('selection after destroy throws', rejectsSelection(0) && rejectsSelection(null));
                    root.click();
                    hotspot?.click();
                    await timeout(250);
                    check('detached annotation controls stay inert', state.selectedAnnotation === selected);
                    check(
                        'annotation teardown releases context and subtree',
                        (await released(handles)) && host.childElementCount === 0
                    );
                    document.getElementById('annotation-controls').hidden = true;
                    await reportUnhandled();
                };
            } else if (mode === 'playback' || mode === 'camera') {
                const host = addHost();
                const viewer = await createViewer({
                    container: host,
                    settings,
                    ...createOptions(),
                    exposeGlobals: true
                });
                const { state, events } = viewer;
                const check = (name, ok) => log(`${ok ? 'ok  ' : 'FAIL'} ${name}`, !ok);
                const rejectsSeek = (time) => {
                    try {
                        viewer.seek(time);
                        return false;
                    } catch {
                        return true;
                    }
                };
                const cameraCommands = ['frameScene', 'resetCamera', 'toggleWalk'];
                const cameraCommandsThrow = () =>
                    cameraCommands.every((command) => {
                        try {
                            viewer[command]();
                            return false;
                        } catch {
                            return true;
                        }
                    });
                check('seek before load throws', !state.loaded && rejectsSeek(0));
                check('camera commands before load throw', !state.loaded && cameraCommandsThrow());
                events.once('loaded:changed', () => {
                    state.animationPaused = true;
                });
                check('loaded', await until(() => state.loaded, 120000));
                check('host pause on loaded is retained', state.animationPaused);
                check('non-finite seeks throw', [NaN, Infinity, -Infinity].every(rejectsSeek));
                viewer.seek(state.animationDuration / 2);
                check(
                    'seek updates time and preserves pause',
                    state.animationPaused && state.animationTime === state.animationDuration / 2
                );
                state.animationPaused = false;
                viewer.seek(0);
                check('seek preserves playing state', !state.animationPaused);
                state.animationPaused = true;
                const captured = await viewer.captureFrame({ time: 1, width: 64 });
                check('capture at a time succeeds', captured.width === 64 && state.animationTime === 1);
                await window.scrubTo(0);
                check('legacy scrub pauses and settles', state.animationPaused && state.animationTime === 0);

                state.gamingControls = false;
                viewer.frameScene();
                check('frame selects orbit', state.cameraMode === 'orbit');
                viewer.resetCamera();
                const initial = settings.cameras[0]?.initial;
                if (initial) {
                    check(
                        'reset restores authored position',
                        await until(() => {
                            const p = cameraOf(viewer).getPosition();
                            return (
                                Math.hypot(
                                    p.x - initial.position[0],
                                    p.y - initial.position[1],
                                    p.z - initial.position[2]
                                ) < 0.01
                            );
                        }, 5000)
                    );
                }
                state.cameraMode = 'fly';
                // Let the entry transition (including any collision adjustment) finish.
                await timeout(1200);
                const spawn = cameraOf(viewer).getPosition().clone();
                const arrow = (type) =>
                    window.dispatchEvent(new KeyboardEvent(type, { key: 'ArrowUp', code: 'ArrowUp', bubbles: true }));
                arrow('keydown');
                check(
                    'fly camera moves',
                    await until(() => cameraOf(viewer).getPosition().distance(spawn) > 0.1, 5000)
                );
                arrow('keyup');
                // Keyboard movement decelerates after release; reset once that input has settled.
                await timeout(2000);
                viewer.resetCamera();
                check(
                    'fly reset returns to entry spawn',
                    await until(() => cameraOf(viewer).getPosition().distance(spawn) < 0.01, 5000)
                );
                check('reset preserves fly mode', state.cameraMode === 'fly');
                viewer.toggleWalk();
                if (state.walkAllowed) {
                    check('walk toggle enters walk', state.cameraMode === 'walk');
                    viewer.resetCamera();
                    check('reset preserves walk mode', state.cameraMode === 'walk');
                    viewer.toggleWalk();
                    check('walk toggle restores fly', state.cameraMode === 'fly');
                    state.cameraMode = 'orbit';
                    state.cameraMode = 'walk';
                    viewer.toggleWalk();
                    check('walk toggle restores a host-selected return mode', state.cameraMode === 'orbit');
                } else {
                    check('unavailable walk leaves mode unchanged', state.cameraMode === 'fly');
                }
                viewer.seek(0);

                const status = document.getElementById('playback-state');
                const update = () => {
                    status.textContent = `paused=${state.animationPaused} time=${state.animationTime.toFixed(2)}/${state.animationDuration} mode=${state.cameraMode} walkAllowed=${state.walkAllowed}`;
                };
                ['animationPaused', 'animationTime', 'cameraMode'].forEach((key) =>
                    events.on(`${key}:changed`, update)
                );
                update();
                document.getElementById('playback').hidden = false;
                document.getElementById('host-orbit').onclick = () => {
                    state.cameraMode = 'orbit';
                };
                document.getElementById('host-fly').onclick = () => {
                    state.cameraMode = 'fly';
                };
                document.getElementById('host-walk').onclick = () => viewer.toggleWalk();
                document.getElementById('host-frame').onclick = () => viewer.frameScene();
                document.getElementById('host-reset').onclick = () => viewer.resetCamera();
                document.getElementById('host-play').onclick = () => {
                    state.cameraMode = 'anim';
                    state.animationPaused = false;
                };
                document.getElementById('host-pause').onclick = () => {
                    state.animationPaused = true;
                };
                document.getElementById('host-seek').onclick = () => viewer.seek(state.animationDuration / 2);
                document.getElementById('host-end').onclick = () => viewer.seek(state.animationDuration);
                document.getElementById('host-auto-pause').onclick = () => {
                    events.once('animationTime:changed', () => {
                        state.animationPaused = true;
                    });
                };
                document.getElementById('host-destroy').onclick = async () => {
                    const app = viewer.app;
                    const handles = handlesOf(viewer);
                    const scrub = window.scrubTo(0).then(
                        () => 'resolved',
                        () => 'rejected'
                    );
                    viewer.destroy();
                    const settled = await Promise.race([scrub, timeout(2000, 'hung')]);
                    check('pending legacy scrub rejects on destroy', settled === 'rejected');
                    check('frame listener removed', !app.hasEvent('frameend'));
                    check('seek after destroy throws', rejectsSeek(0));
                    check('camera commands after destroy throw', cameraCommandsThrow());
                    check(
                        'context released and subtree removed',
                        (await released(handles)) && host.childElementCount === 0
                    );
                    document.getElementById('playback').hidden = true;
                    await reportUnhandled();
                };
                // Several viewers at once, each in its own host so each has a distinct root.
            } else if (instances > 1) {
                log(`${instances} instances, renderer=${renderer}, tab ${document.visibilityState}`);
                const hostEls = [];
                const viewers = [];
                let failures = 0;
                const check = (name, ok, detail = '') => {
                    if (!ok) failures++;
                    log(`${ok ? 'ok  ' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`, !ok);
                };
                try {
                    check('destroy during a metadata load stays quiet', await metaTeardown());

                    for (let i = 0; i < instances; i++) {
                        const h = addHost();
                        hostEls.push(h);
                        viewers.push(await createViewer({ container: h, settings, ...createOptions() }));
                    }
                    const handles = viewers.map(handlesOf);

                    check('all instances loaded', await until(() => viewers.every((v) => v.state.loaded), 120000));
                    check('no window.app published', window.app === undefined);
                    check(
                        'one viewer subtree per host',
                        hostEls.every((h) => h.querySelectorAll('.sse-viewer').length === 1)
                    );
                    check(
                        'canvas fills its host, not the viewport',
                        hostEls.every((h) => {
                            const r = h.querySelector('canvas').getBoundingClientRect();
                            const b = h.getBoundingClientRect();
                            return Math.abs(r.left - b.left) < 1 && Math.abs(r.width - b.width) < 1;
                        })
                    );
                    log(
                        `hotspots per instance: ${hostEls.map((h) => h.querySelectorAll('.sse-annotation-hotspot').length).join(', ')}`
                    );
                    check('distinct apps', new Set(viewers.map((v) => v.app)).size === instances);
                    if (viewers[0].annotations.length) {
                        viewers[0].selectAnnotation(0);
                        check('annotation selection is independent', viewers[1].state.selectedAnnotation === null);
                        viewers[1].selectAnnotation(0);
                        hostEls[1].querySelector('.sse-viewer').click();
                        check(
                            'click-away is scoped to its viewer',
                            viewers[0].state.selectedAnnotation === 0 && viewers[1].state.selectedAnnotation === null
                        );
                        viewers[0].selectAnnotation(null);
                    }
                    viewers.forEach((v) => {
                        v.state.animationPaused = true;
                    });
                    const secondTime = viewers[1].state.animationTime;
                    viewers[0].seek(viewers[0].state.animationDuration / 2);
                    check(
                        'seeking one instance leaves the other unchanged',
                        viewers[1].state.animationTime === secondTime
                    );
                    check(
                        'entities belong to their own app',
                        viewers.every((v) => v.app.root.children.every((e) => e._app === v.app))
                    );

                    // state and ui are independent: changing one camera mode moves only its buttons
                    viewers[0].state.cameraMode = 'fly';
                    await timeout(50);
                    check(
                        'state does not leak between instances',
                        viewers.slice(1).every((v) => v.state.cameraMode !== 'fly')
                    );
                    check(
                        'ui follows its own instance',
                        hostEls[0].querySelector('.sse-flyCamera').classList.contains('sse-active') &&
                            !hostEls[1].querySelector('.sse-flyCamera').classList.contains('sse-active')
                    );

                    // the keyboard listens on window, so the host says which instance it drives
                    const pressOne = () =>
                        window.dispatchEvent(new KeyboardEvent('keydown', { key: '1', code: 'Digit1', bubbles: true }));
                    viewers.forEach((v) => (v.state.cameraMode = 'fly'));
                    viewers[0].state.inputEnabled = false;
                    pressOne();
                    check(
                        'an instance with input disabled ignores the keyboard',
                        viewers[0].state.cameraMode === 'fly' && viewers[1].state.cameraMode === 'orbit'
                    );
                    viewers[0].state.inputEnabled = true;
                    pressOne();
                    check('and takes it again once re-enabled', viewers[0].state.cameraMode === 'orbit');

                    // the same for the engine's own key source: a held arrow key flies only the
                    // enabled instance. An arrow rather than W, which is also the shortcut that
                    // turns on gaming controls and with them pointer lock
                    const arrow = (type) =>
                        window.dispatchEvent(
                            new KeyboardEvent(type, { key: 'ArrowUp', code: 'ArrowUp', bubbles: true })
                        );
                    viewers.forEach((v) => (v.state.cameraMode = 'fly'));
                    viewers[0].state.inputEnabled = false;
                    const before = viewers.map((v) => cameraOf(v).getPosition().clone());
                    arrow('keydown');
                    // a hidden tab throttles frames, so wait for the movement rather than a fixed time
                    const distance = (i) => cameraOf(viewers[i]).getPosition().distance(before[i]);
                    await until(() => distance(1) > 0.01, 5000);
                    arrow('keyup');
                    const moved = viewers.map((v, i) => distance(i));
                    check(
                        'a held arrow key moves only the enabled instance',
                        moved[0] < 1e-6 && moved[1] > 0.01,
                        `moved ${moved.map((m) => m.toFixed(3)).join(', ')}`
                    );
                    viewers[0].state.inputEnabled = true;

                    // a capture still waiting on a frame when its viewer goes away must settle
                    // rather than hang on an event that is never going to arrive
                    const midCapture = viewers[0].captureFrame({ width: 64 }).then(
                        () => 'resolved',
                        () => 'rejected'
                    );

                    // the first goes away, the second must keep rendering
                    viewers[0].destroy();
                    check('first subtree removed', hostEls[0].childElementCount === 0);
                    check('first released', await released(handles[0]));
                    const survivor = viewers[1].app;
                    survivor.renderNextFrame = true;
                    const rendered = await Promise.race([
                        new Promise((resolve) => survivor.once('frameend', () => resolve(true))),
                        timeout(5000, false)
                    ]);
                    check('second still renders after the first is destroyed', rendered);
                    check('second still has its ui', hostEls[1].querySelectorAll('.sse-ui').length === 1);

                    const midResult = await Promise.race([midCapture, timeout(5000, 'hung')]);
                    check(`a capture in flight at destroy settles (${midResult})`, midResult !== 'hung');

                    for (let i = 1; i < instances; i++) {
                        viewers[i].destroy();
                        check(`instance ${i + 1} released`, await released(handles[i]));
                    }
                } catch (err) {
                    failures++;
                    log(`failed: ${err?.message ?? err}`, true);
                    console.error(err);
                }
                failures += await reportUnhandled();
                log(failures ? `done, ${failures} failed` : 'done, instances coexist', failures > 0);
            } else {
                // A hidden tab throttles requestAnimationFrame, and the reveal needs many frames, so
                // iterations run far slower until the pane is visible.
                log(`${iterations} iterations, mode=${mode}, renderer=${renderer}, tab ${document.visibilityState}`);

                let failures = 0;
                const metaClean = await metaTeardown();
                if (!metaClean) failures++;
                log(`destroy during a metadata load stays quiet: ${metaClean ? 'ok' : 'FAIL'}`, !metaClean);
                for (let i = 1; i <= iterations; i++) {
                    const started = performance.now();
                    const host = addHost();

                    // the viewer calls this hook once the first complete frame has rendered
                    const firstFrame = new Promise((resolve) => {
                        window.firstFrame = () => resolve(true);
                    });

                    try {
                        const viewer = await createViewer({ container: host, settings, ...createOptions() });
                        const handles = handlesOf(viewer);

                        // In immediate mode the destroy below lands before the first frame, so
                        // this capture is still waiting on it. It must settle rather than hang on
                        // an event that is never going to fire.
                        const capture =
                            mode === 'immediate'
                                ? viewer.captureFrame({ width: 64 }).then(
                                      () => 'resolved',
                                      () => 'rejected'
                                  )
                                : null;

                        if (mode === 'loaded') {
                            const rendered = await Promise.race([firstFrame, timeout(120000, false)]);
                            if (!rendered) {
                                viewer.destroy();
                                throw new Error('no first frame within 120s — check the content url');
                            }
                        }

                        // `loaded` flips in the viewer's own first-frame handler, so it proves the hook
                        // came from this instance rendering and not from anything stale
                        const { loaded, progress } = viewer.state;

                        const overlayReleased =
                            mode === 'loaded' && url.searchParams.has('overlay')
                                ? await enableVoxelOverlay(viewer)
                                : null;
                        viewer.destroy();
                        const removed = host.childElementCount === 0;

                        const freed = await released(handles);
                        const captured = capture ? await Promise.race([capture, timeout(2000, 'hung')]) : 'n/a';
                        const overlayFreed = overlayReleased ? overlayReleased() : true;
                        const ok =
                            freed && removed && overlayFreed && captured !== 'hung' && (mode !== 'loaded' || loaded);
                        if (!ok) failures++;
                        log(
                            `#${i} ${handles.device.deviceType} ${Math.round(performance.now() - started)}ms loaded=${loaded} progress=${progress} released=${freed} removed=${removed} capture=${captured} overlay=${overlayReleased ? overlayFreed : 'n/a'}`,
                            !ok
                        );
                    } catch (err) {
                        failures++;
                        log(`#${i} failed: ${err?.message ?? err}`, true);
                        console.error(err);
                    }
                    host.remove();
                }

                delete window.firstFrame;
                failures += await reportUnhandled();
                log(failures ? `done, ${failures} failed` : 'done, no leaks detected', failures > 0);
            }
        </script>
    </body>
</html>
