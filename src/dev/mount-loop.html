<!doctype html>
<html lang="en">
    <head>
        <title>SuperSplat Viewer — mount/unmount loop</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <link rel="stylesheet" href="./index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            /* one sized host per instance, side by side */
            #hosts {
                display: flex;
                height: 100%;
            }
            #hosts > div {
                flex: 1;
                min-width: 0;
                height: 100%;
                outline: 1px solid #444;
            }
            #harness {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 1000;
                max-height: calc(100vh - 16px);
                overflow: auto;
                padding: 8px 12px;
                background: rgba(0, 0, 0, 0.75);
                color: #e0dcdd;
                font: 12px/1.5 monospace;
                white-space: pre;
                pointer-events: none;
            }
            #harness .fail {
                color: #f66;
            }
        </style>
    </head>
    <body>
        <!--
            Development harness for Viewer.destroy(). Mounts the viewer into a host div through
            createViewer, waits for the first frame (or not, in immediate mode), destroys it,
            and repeats. Browsers cap live WebGL contexts at around 16, so twenty iterations
            that all reach a first frame is itself the leak test; each iteration also reports
            whether the previous context was released and whether the subtree was removed.

            TEMPORARY. This page is run by hand before any change to teardown-sensitive code
            merges (viewer-api-plan.md, phases D and E). It is rewritten as a browser test
            against createViewer at E4; delete it, and its emit in rollup.config.mjs, when that
            test lands.

            With ?instances=N it instead mounts N viewers at once into sibling hosts laid out
            side by side, checks they do not share dom, state or window globals, destroys the
            first while the second keeps rendering, then destroys the rest.

            Params: ?iterations=20  ?mode=loaded|immediate  ?instances=2  ?webgl  ?content=  ?settings=
        -->
        <div id="hosts"></div>
        <pre id="harness"></pre>

        <script type="module">
            import { createViewer } from './index.js';

            const url = new URL(location.href);
            const iterations = Number(url.searchParams.get('iterations') ?? 20);
            const instances = Number(url.searchParams.get('instances') ?? 1);
            const mode = url.searchParams.get('mode') ?? 'loaded';
            const renderer = url.searchParams.has('webgl') ? 'webgl' : 'webgpu';
            const contentUrl = url.searchParams.get('content') ?? './scene.compressed.ply';
            const settingsUrl = url.searchParams.get('settings') ?? './settings.json';

            const harness = document.getElementById('harness');
            const log = (line, fail = false) => {
                const span = document.createElement('span');
                span.textContent = `${line}\n`;
                if (fail) span.className = 'fail';
                harness.appendChild(span);
                console.log(`[mount-loop] ${line}`);
            };

            // A promise the viewer drops on teardown shows up here rather than in the console
            // only, so teardown paths that reject without a handler fail the run.
            const unhandled = [];
            window.addEventListener('unhandledrejection', (event) => {
                unhandled.push(event.reason?.message ?? String(event.reason));
            });
            const reportUnhandled = () => {
                // a rejection is reported a task after it happens, so let the queue drain first
                return timeout(50).then(() => {
                    if (unhandled.length) {
                        log(`FAIL ${unhandled.length} unhandled rejection(s): ${unhandled.join(' | ')}`, true);
                    }
                    return unhandled.length;
                });
            };

            const settings = await (await fetch(settingsUrl)).json();

            // Every other option at its default; an embedded instance publishes no window.* hooks,
            // so two viewers cannot collide on them.
            const createOptions = () => ({ contentUrl, renderer, exposeGlobals: false });
            const cameraOf = (viewer) => viewer.app.root.findByName('camera');

            const hosts = document.getElementById('hosts');
            const addHost = () => {
                const h = document.createElement('div');
                hosts.appendChild(h);
                return h;
            };
            const timeout = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
            const until = async (test, ms) => {
                const deadline = performance.now() + ms;
                while (!test()) {
                    if (performance.now() > deadline) return false;
                    await timeout(100);
                }
                return true;
            };
            const handlesOf = (viewer) => {
                const device = viewer.app.graphicsDevice;
                return {
                    device,
                    gl: device.gl ?? null,
                    lost: device.wgpu ? device.wgpu.lost.then(() => true) : null
                };
            };
            const released = async ({ gl, lost }) =>
                gl ? gl.isContextLost() : await Promise.race([lost, timeout(1000, false)]);

            // Teardown during a metadata load. `meta.json` content is read with an await before
            // the asset is registered, so a destroy can land inside it and the continuation must
            // not touch the app it just lost. Driven with a `contents` promise this page
            // controls, so the timing is exact rather than a race with the network; the url is
            // never fetched, since supplying `contents` is what the document does too.
            const metaTeardown = async () => {
                const host = addHost();
                const before = unhandled.length;
                let deliver;
                const contents = new Promise((resolve) => {
                    deliver = () => resolve(new Response('{}'));
                });
                const viewer = await createViewer({
                    container: host,
                    settings,
                    ...createOptions(),
                    contentUrl: './meta.json',
                    contents
                });
                viewer.destroy();
                deliver();
                await timeout(100);
                host.remove();
                return unhandled.length === before;
            };

            // Several viewers at once, each in its own host so each has a distinct root.
            if (instances > 1) {
                log(`${instances} instances, renderer=${renderer}, tab ${document.visibilityState}`);
                const hostEls = [];
                const viewers = [];
                let failures = 0;
                const check = (name, ok, detail = '') => {
                    if (!ok) failures++;
                    log(`${ok ? 'ok  ' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`, !ok);
                };
                try {
                    check('destroy during a metadata load stays quiet', await metaTeardown());

                    for (let i = 0; i < instances; i++) {
                        const h = addHost();
                        hostEls.push(h);
                        viewers.push(await createViewer({ container: h, settings, ...createOptions() }));
                    }
                    const handles = viewers.map(handlesOf);

                    check('all instances loaded', await until(() => viewers.every((v) => v.state.loaded), 120000));
                    check('no window.app published', window.app === undefined);
                    check(
                        'one viewer subtree per host',
                        hostEls.every((h) => h.querySelectorAll('.sse-viewer').length === 1)
                    );
                    check(
                        'canvas fills its host, not the viewport',
                        hostEls.every((h) => {
                            const r = h.querySelector('canvas').getBoundingClientRect();
                            const b = h.getBoundingClientRect();
                            return Math.abs(r.left - b.left) < 1 && Math.abs(r.width - b.width) < 1;
                        })
                    );
                    log(
                        `hotspots per instance: ${hostEls.map((h) => h.querySelectorAll('.sse-annotation-hotspot').length).join(', ')}`
                    );
                    check('distinct apps', new Set(viewers.map((v) => v.app)).size === instances);
                    check(
                        'entities belong to their own app',
                        viewers.every((v) => v.app.root.children.every((e) => e._app === v.app))
                    );

                    // state and ui are independent: changing one camera mode moves only its buttons
                    viewers[0].state.cameraMode = 'fly';
                    await timeout(50);
                    check(
                        'state does not leak between instances',
                        viewers.slice(1).every((v) => v.state.cameraMode !== 'fly')
                    );
                    check(
                        'ui follows its own instance',
                        hostEls[0].querySelector('.sse-flyCamera').classList.contains('sse-active') &&
                            !hostEls[1].querySelector('.sse-flyCamera').classList.contains('sse-active')
                    );

                    // the keyboard listens on window, so the host says which instance it drives
                    const pressOne = () =>
                        window.dispatchEvent(new KeyboardEvent('keydown', { key: '1', code: 'Digit1', bubbles: true }));
                    viewers.forEach((v) => (v.state.cameraMode = 'fly'));
                    viewers[0].state.inputEnabled = false;
                    pressOne();
                    check(
                        'an instance with input disabled ignores the keyboard',
                        viewers[0].state.cameraMode === 'fly' && viewers[1].state.cameraMode === 'orbit'
                    );
                    viewers[0].state.inputEnabled = true;
                    pressOne();
                    check('and takes it again once re-enabled', viewers[0].state.cameraMode === 'orbit');

                    // the same for the engine's own key source: a held arrow key flies only the
                    // enabled instance. An arrow rather than W, which is also the shortcut that
                    // turns on gaming controls and with them pointer lock
                    const arrow = (type) =>
                        window.dispatchEvent(
                            new KeyboardEvent(type, { key: 'ArrowUp', code: 'ArrowUp', bubbles: true })
                        );
                    viewers.forEach((v) => (v.state.cameraMode = 'fly'));
                    viewers[0].state.inputEnabled = false;
                    const before = viewers.map((v) => cameraOf(v).getPosition().clone());
                    arrow('keydown');
                    // a hidden tab throttles frames, so wait for the movement rather than a fixed time
                    const distance = (i) => cameraOf(viewers[i]).getPosition().distance(before[i]);
                    await until(() => distance(1) > 0.01, 5000);
                    arrow('keyup');
                    const moved = viewers.map((v, i) => distance(i));
                    check(
                        'a held arrow key moves only the enabled instance',
                        moved[0] < 1e-6 && moved[1] > 0.01,
                        `moved ${moved.map((m) => m.toFixed(3)).join(', ')}`
                    );
                    viewers[0].state.inputEnabled = true;

                    // the first goes away, the second must keep rendering
                    viewers[0].destroy();
                    check('first subtree removed', hostEls[0].childElementCount === 0);
                    check('first released', await released(handles[0]));
                    const survivor = viewers[1].app;
                    survivor.renderNextFrame = true;
                    const rendered = await Promise.race([
                        new Promise((resolve) => survivor.once('frameend', () => resolve(true))),
                        timeout(5000, false)
                    ]);
                    check('second still renders after the first is destroyed', rendered);
                    check('second still has its ui', hostEls[1].querySelectorAll('.sse-ui').length === 1);

                    for (let i = 1; i < instances; i++) {
                        viewers[i].destroy();
                        check(`instance ${i + 1} released`, await released(handles[i]));
                    }
                } catch (err) {
                    failures++;
                    log(`failed: ${err?.message ?? err}`, true);
                    console.error(err);
                }
                failures += await reportUnhandled();
                log(failures ? `done, ${failures} failed` : 'done, instances coexist', failures > 0);
            } else {
                // A hidden tab throttles requestAnimationFrame, and the reveal needs many frames, so
                // iterations run far slower until the pane is visible.
                log(`${iterations} iterations, mode=${mode}, renderer=${renderer}, tab ${document.visibilityState}`);

                let failures = 0;
                const metaClean = await metaTeardown();
                if (!metaClean) failures++;
                log(`destroy during a metadata load stays quiet: ${metaClean ? 'ok' : 'FAIL'}`, !metaClean);
                for (let i = 1; i <= iterations; i++) {
                    const started = performance.now();
                    const host = addHost();

                    // the viewer calls this hook once the first complete frame has rendered
                    const firstFrame = new Promise((resolve) => {
                        window.firstFrame = () => resolve(true);
                    });

                    try {
                        const viewer = await createViewer({ container: host, settings, ...createOptions() });
                        const handles = handlesOf(viewer);

                        // In immediate mode the destroy below lands before the first frame, so
                        // this capture is still waiting on it. It must settle rather than hang on
                        // an event that is never going to fire.
                        const capture =
                            mode === 'immediate'
                                ? viewer.captureFrame({ width: 64 }).then(
                                      () => 'resolved',
                                      () => 'rejected'
                                  )
                                : null;

                        if (mode === 'loaded') {
                            const rendered = await Promise.race([firstFrame, timeout(120000, false)]);
                            if (!rendered) {
                                viewer.destroy();
                                throw new Error('no first frame within 120s — check the content url');
                            }
                        }

                        // `loaded` flips in the viewer's own first-frame handler, so it proves the hook
                        // came from this instance rendering and not from anything stale
                        const { loaded, progress } = viewer.state;

                        viewer.destroy();
                        const removed = host.childElementCount === 0;

                        const freed = await released(handles);
                        const captured = capture ? await Promise.race([capture, timeout(2000, 'hung')]) : 'n/a';
                        const ok = freed && removed && captured !== 'hung' && (mode !== 'loaded' || loaded);
                        if (!ok) failures++;
                        log(
                            `#${i} ${handles.device.deviceType} ${Math.round(performance.now() - started)}ms loaded=${loaded} progress=${progress} released=${freed} removed=${removed} capture=${captured}`,
                            !ok
                        );
                    } catch (err) {
                        failures++;
                        log(`#${i} failed: ${err?.message ?? err}`, true);
                        console.error(err);
                    }
                    host.remove();
                }

                delete window.firstFrame;
                failures += await reportUnhandled();
                log(failures ? `done, ${failures} failed` : 'done, no leaks detected', failures > 0);
            }
        </script>
    </body>
</html>
